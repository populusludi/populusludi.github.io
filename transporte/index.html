<title>Travessia · Populus Ludi</title>
<style>
/* Layout: la tavola esagonale di legno al centro; a fianco (sotto, sul telefono) il turno, i comandi e le regole. Il bordo della tavola indica dove deve arrivare ogni colore. */
:root {
  --bg: #e9e6df;
  --surface: #f5f3ee;
  --ink: #1f2322;
  --muted: #5e6563;
  --line: #d0ccc2;
  --accent: #1e6662;
  --accent-ink: #f4fbfa;
  --bad: #a63a24;
  --good: #2c7a3d;
  --wood: #a9784a;
  --wood-dark: #8a5d33;
  --wood-edge: #5e3d1e;
  --hole: #ffffff;
  --hole-edge: #7d5a37;
  --hole-in: #ece7de;
  --light: #eccf98; --light-edge: #a07a3e; --light-ink: #3a2e1c;
  --dark: #2c1f17; --dark-edge: #0e0806; --dark-ink: #f4ecdc;
  --target: #1e6662;
  --f-display: "Zilla Slab", Rockwell, Georgia, serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --shadow: rgba(60, 35, 10, .3);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a19; --surface: #202524; --ink: #e8ece9; --muted: #9aa5a1; --line: #343b39;
    --accent: #5fc0b6; --accent-ink: #0c1f1d; --bad: #f08b75; --good: #7fcf8d;
    --wood: #8a6238; --wood-dark: #6f4b27; --wood-edge: #3f2912; --hole: #f4f1ea; --hole-edge: #3f2912; --hole-in: #e2ddd2;
    --target: #7fe0d4; --shadow: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a19; --surface: #202524; --ink: #e8ece9; --muted: #9aa5a1; --line: #343b39;
  --accent: #5fc0b6; --accent-ink: #0c1f1d; --bad: #f08b75; --good: #7fcf8d;
  --wood: #8a6238; --wood-dark: #6f4b27; --wood-edge: #3f2912; --hole: #f4f1ea; --hole-edge: #3f2912; --hole-in: #e2ddd2;
  --target: #7fe0d4; --shadow: rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
h1 { font: 700 2.1rem/1 var(--f-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); flex: 1 1 260px; min-width: 0; }
.main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.boardbox { min-width: 0; display: grid; gap: 8px; }
svg.board { width: 100%; height: auto; display: block; max-width: 640px; margin-inline: auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; color: var(--muted); font-size: .85rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chip { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1.5px solid; flex: none; }
.chip.l { background: var(--light); border-color: var(--light-edge); }
.chip.d { background: var(--dark); border-color: var(--dark-edge); box-shadow: 0 0 0 1.5px var(--muted); }
.side { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { font: 700 1.05rem/1.2 var(--f-display); margin: 0; }
.turn { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; }
.turn .chip { width: 22px; height: 22px; border-width: 2px; }
.turn strong { font-weight: 700; }
.msg { margin: 0; min-height: 1.5em; color: var(--muted); }
.msg.bad { color: var(--bad); font-weight: 600; }
.msg.good { color: var(--good); font-weight: 700; }
.countdown { display: flex; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.countdown b { font: 500 2.4rem/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--accent); min-width: 2.4ch; text-align: right; }
.countdown small { color: var(--muted); font-size: .85rem; min-width: 0; }
.countdown.zero b { color: var(--good); }
.countdown.over { border-color: var(--bad); }
.countdown.over b { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: grid; gap: 2px; }
.stat b { font: 500 1.35rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: 600 .92rem/1 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 13px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.langsel { margin-left: auto; align-self: center; font: inherit; font-size: .9rem; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.langsel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.replay { display: grid; gap: 8px; }
.note { color: var(--muted); font-size: .86rem; margin: 0; }
ol.rules { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; max-width: 65ch; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
/* tavola */
.rim-l { fill: var(--light); stroke: var(--light-edge); stroke-width: 1.5; }
.rim-d { fill: var(--dark); stroke: var(--dark-edge); stroke-width: 1.5; }
.plate { fill: var(--wood); stroke: var(--wood-edge); stroke-width: 2; }
.grain { stroke: var(--wood-dark); stroke-width: 1; fill: none; opacity: .35; }
.hole { fill: var(--hole); stroke: var(--hole-edge); stroke-width: 1.5; }
.hole-in { fill: var(--hole-in); }
.cell { cursor: pointer; }
.target { fill: none; stroke: var(--target); stroke-width: 3.5; stroke-dasharray: 5 4; pointer-events: none; }
.trail { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; opacity: .55; fill: none; pointer-events: none; }
.piece { transition: transform .26s ease; pointer-events: none; }
.piece circle.body { stroke-width: 2.5; }
.piece.l circle.body { fill: var(--light); stroke: var(--light-edge); }
.piece.d circle.body { fill: var(--dark); stroke: var(--dark-edge); }
.piece circle.ring { fill: none; stroke: none; }
.piece circle.shine { fill: #fff; opacity: .18; }
.piece.sel circle.body { stroke: var(--target); stroke-width: 4.5; }
.piece.can circle.ring { fill: none; stroke: var(--target); stroke-width: 1.5; opacity: .55; }
@media (prefers-reduced-motion: reduce) { .piece { transition: none; } }
</style>

<script id="i18n">
// Lingue dell'interfaccia: IT (fonte), PT-BR, EN, ES. build.js lo incorpora inline (niente fetch: funziona da file:// e come artifact).
// Uso: I18N.t('chiave', {var}) · elementi con data-i18n / data-i18n-html / data-i18n-aria / data-i18n-title · <select id="selLang">.
const I18N = ((STORE, DICT) => {
  const LANGS = { it: ['it', 'Italiano'], pt: ['pt-BR', 'Português'], en: ['en', 'English'], es: ['es', 'Español'] };
  const missing = new Set();
  function detect() {
    try { const s = localStorage.getItem(STORE); if (DICT[s]) return s; } catch (e) {}
    const nav = typeof navigator !== 'undefined' ? navigator.language || (navigator.languages || [])[0] || '' : '';
    return { pt: 'pt', es: 'es', it: 'it' }[String(nav).toLowerCase().slice(0, 2)] || 'en';
  }
  let lang = detect();
  const subs = [];
  const fmt = (s, v = {}) => typeof s === 'function' ? s(v) : s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  function t(k, v) {
    const s = k in DICT[lang] ? DICT[lang][k] : DICT.it[k];
    if (s === undefined) { missing.add(k); return k; }
    return fmt(s, v);
  }
  function apply() {
    if (typeof document === 'undefined') return;
    const q = (sel, f) => document.querySelectorAll(sel).forEach(f);
    q('[data-i18n]', e => { e.textContent = t(e.dataset.i18n); });
    q('[data-i18n-html]', e => { e.innerHTML = t(e.dataset.i18nHtml); });
    q('[data-i18n-aria]', e => e.setAttribute('aria-label', t(e.dataset.i18nAria)));
    q('[data-i18n-title]', e => e.setAttribute('title', t(e.dataset.i18nTitle)));
    document.title = t('doc.title');
    document.documentElement.lang = LANGS[lang][0];
    const s = document.getElementById('selLang');
    if (s) s.value = lang;
  }
  function set(l) {
    if (!DICT[l] || l === lang) return;
    lang = l;
    try { localStorage.setItem(STORE, l); } catch (e) {}
    apply();
    subs.forEach(f => f());
  }
  function mount() {
    const s = document.getElementById('selLang');
    if (s) {
      s.replaceChildren(...Object.keys(LANGS).map(k => {
        const o = document.createElement('option');
        o.value = k; o.lang = LANGS[k][0]; o.textContent = LANGS[k][1];
        return o;
      }));
      s.addEventListener('change', () => set(s.value));
    }
    apply();
  }
  return { t, set, apply, mount, onChange: f => subs.push(f), get lang() { return lang; }, DICT, missing };

  if (worker) worker.onmessage = e => { const f = pending[e.data.id]; delete pending[e.data.id]; if (f) f(e.data.r); };
  function think(s, cb) {
    const id = ++ask;
    if (worker) { pending[id] = cb; worker.postMessage({ id, s }); }
    else setTimeout(() => cb(T.partnerMove(s)), 30);
  }
  const computerPlays = () => mode === 'solo' && !replay && game.turn === T.DARK && !T.isGoal(game) && !T.isStuck(game);
  function computerTurn() {
    if (!computerPlays() || thinking) return;
    const token = thinking = Date.now();
    render();
    const t0 = Date.now();
    const go = r => {
      if (thinking !== token) return;
      const wait = Math.max(0, 380 - (Date.now() - t0));
      setTimeout(() => {
        if (thinking !== token) return;
        thinking = 0;
        if (!r || !r.move) { render(); return; }
        lostWarn = !!r.lost;
        planCache = r.plan && sameMove(r.plan[0], r.move) ? r.plan : null;
        const m = T.legalMoves(game).find(x => sameMove(x, r.move));
        if (m) doMove(m); else render();
      }, wait);
    };
    if (planCache && planCache.length && T.legalMoves(game).some(x => sameMove(x, planCache[0]))) go({ move: planCache[0], plan: planCache });
    else think(game, go);
  }
  try { const v = localStorage.getItem('transporte-best'); if (v) best = +v; } catch (e) {}
  try { const m = localStorage.getItem('transporte-mode'); if (m === 'due') mode = 'due'; } catch (e) {}

  // tavola: esagono con il bordo diviso in due, scuro in alto (dove arrivano gli scuri) e chiaro in basso
  const corner = (q, r, pad) => { const x = (q + r / 2) * D, y = r * D * Math.sqrt(3) / 2; const l = Math.hypot(x, y); return [x + x / l * pad, y + y / l * pad]; };
  const hexPts = pad => [[0, -3], [3, -3], [3, 0], [0, 3], [-3, 3], [-3, 0]].map(([q, r]) => corner(q, r, pad).map(v => v.toFixed(1)).join(',')).join(' ');
  const defs = el('defs', {});
  const cpTop = el('clipPath', { id: 'cp-top' }, defs); el('polygon', { points: '-400,-400 400,-400 400,-30 -400,30' }, cpTop);
  const cpBot = el('clipPath', { id: 'cp-bot' }, defs); el('polygon', { points: '-400,30 400,-30 400,400 -400,400' }, cpBot);
  el('polygon', { points: hexPts(58), class: 'rim-d', 'clip-path': 'url(#cp-top)' });
  el('polygon', { points: hexPts(58), class: 'rim-l', 'clip-path': 'url(#cp-bot)' });
  el('polygon', { points: hexPts(44), class: 'plate' });
  for (let i = -5; i <= 5; i++) el('path', { class: 'grain', d: `M -200 ${i * 30 + 6} C -80 ${i * 30 - 8}, 60 ${i * 30 + 14}, 200 ${i * 30}`, 'clip-path': 'url(#cp-plate)' });
  const cpPlate = el('clipPath', { id: 'cp-plate' }, defs); el('polygon', { points: hexPts(42) }, cpPlate);
  const trail = el('path', { class: 'trail', d: '' });
  const cellEls = T.CELLS.map((c, i) => {
    const g = el('g', { class: 'cell', 'data-i': i, transform: `translate(${XY[i][0].toFixed(1)},${XY[i][1].toFixed(1)})` });
    el('circle', { r: R + 2, class: 'hole' }, g);
    el('circle', { r: R - 4, class: 'hole-in', cy: 1.5 }, g);
    const t = el('circle', { r: R + 3, class: 'target' }, g); t.style.display = 'none';
    g.addEventListener('click', () => tap(i));
    return { g, t };
  });
  const layer = el('g', {});
  const pieces = [];
  T.START.forEach((v, i) => {
    if (!v) return;
    const g = el('g', { class: 'piece ' + (v === T.LIGHT ? 'l' : 'd') }, layer);
    el('circle', { r: R + 9, class: 'ring' }, g);
    el('circle', { r: R, class: 'body' }, g);
    el('circle', { r: R * .42, cx: -R * .3, cy: -R * .32, class: 'shine' }, g);
    pieces.push({ g, color: v });
  });

  function place(animate) {
    pieces.forEach(p => { if (!animate) p.g.style.transition = 'none'; });
    pieceAt.forEach((pid, i) => { if (pid != null) pieces[pid].g.style.transform = `translate(${XY[i][0]}px,${XY[i][1]}px)`; });
    if (!animate) { svg.getBoundingClientRect(); pieces.forEach(p => { p.g.style.transition = ''; }); }
  }
  function initPieces(board) {
    // assegna un id stabile a ogni pezzo per animare gli spostamenti
    pieceAt = board.map(() => null);
    const free = { 1: [], 2: [] };
    pieces.forEach((p, id) => free[p.color].push(id));
    board.forEach((v, i) => { if (v) pieceAt[i] = free[v].shift(); });
  }

  function reset() { thinking = 0; planCache = null; lostWarn = false; game = T.newGame(); hist = []; sel = null; last = null; initPieces(game.board); place(false); render(); }
  function doMove(m) {
    hist.push(game);
    game = T.play(game, m);
    planCache = planCache && sameMove(planCache[0], m) ? planCache.slice(1) : null;
    pieceAt[m.to] = pieceAt[m.from]; pieceAt[m.from] = null;
    last = m; sel = null; place(true);
    if (T.isGoal(game) && !replay) {
      if (best == null || game.ply < best) { best = game.ply; try { localStorage.setItem('transporte-best', best); } catch (e) {} }
    }
    render();
    if (computerPlays()) computerTurn();
  }
  function undo() {
    if (!hist.length) return;
    thinking = 0; planCache = null; lostWarn = false;
    game = hist.pop();
    // da solo si torna al proprio turno: si annullano la mossa del computer e la propria
    if (mode === 'solo') while (game.turn === T.DARK && hist.length) game = hist.pop();
    sel = null; last = null;
    initPieces(game.board); place(false); render();
  }
  function tap(i) {
    if (replay || T.isGoal(game)) return;
    if (mode === 'solo' && game.turn === T.DARK) { flash(t('msg.wait')); return; }
    const b = game.board;
    if (b[i] === game.turn) {
      const ms = T.legalMoves(game, i);
      sel = (sel === i || !ms.length) ? null : i;
      if (!ms.length) flash(t('msg.nomoves'));
      render(); return;
    }
    if (b[i] === T.EMPTY) {
      const all = T.legalMoves(game);
      const into = sel != null ? all.filter(m => m.from === sel && m.to === i) : all.filter(m => m.to === i);
      if (into.length === 1) { doMove(into[0]); return; }
      if (into.length > 1) { flash(t('msg.two')); return; }
    }
    if (b[i] && b[i] !== game.turn) { flash(t('msg.nt.' + (mode === 'due' ? 'duo' : 'solo') + '.' + (game.turn === T.LIGHT ? 'l' : 'd'))); return; }
    sel = null; render();
  }
  let flashMsg = null, flashT = null;
  function flash(t) { flashMsg = t; clearTimeout(flashT); flashT = setTimeout(() => { flashMsg = null; render(); }, 2200); render(); }

  function render() {
    save();
    const s = game, b = s.board, moves = (replay || T.isGoal(s) || (mode === 'solo' && s.turn === T.DARK)) ? [] : T.legalMoves(s);
    const movable = new Set(moves.map(m => m.from));
    const targets = new Set(moves.filter(m => m.from === sel).map(m => m.to));
    cellEls.forEach(({ t }, i) => { t.style.display = targets.has(i) ? '' : 'none'; });
    pieceAt.forEach((pid, i) => { if (pid == null) return; const c = pieces[pid].g.classList; c.toggle('sel', i === sel); c.toggle('can', movable.has(i) && sel == null); });
    if (last) { const [a, b2] = [XY[last.from], XY[last.to]]; trail.setAttribute('d', `M ${a[0]} ${a[1]} L ${b2[0]} ${b2[1]}`); } else trail.setAttribute('d', '');
    $('turn-chip').className = 'chip ' + (s.turn === T.LIGHT ? 'l' : 'd');
    const goal = T.isGoal(s), stuck = T.isStuck(s);
    const side = s.turn === T.LIGHT ? 'l' : 'd';
    $('turn-text').innerHTML = goal ? t('turn.done') : mode === 'due' ? t('turn.duo.' + side) : t(s.turn === T.LIGHT ? 'turn.you' : 'turn.cpu');
    const m = $('msg'); m.className = 'msg';
    if (replay) m.textContent = replay.k === 0 ? t('msg.replay0') : t(hist.length && lastJump() ? 'msg.jump' : 'msg.slide');
    else if (goal) { m.className = 'msg good'; m.textContent = t('msg.goal', { n: s.ply, j: s.jumps }) + (s.ply < REC ? t('msg.goalnew') : s.ply === REC ? t('msg.goalbest') : ''); }
    else if (stuck) { m.className = 'msg bad'; m.textContent = t('msg.stuck.' + side); }
    else if (lostWarn && mode === 'solo') { m.className = 'msg bad'; m.textContent = t('msg.lost'); }
    else if (thinking) m.textContent = t('msg.thinking');
    else if (flashMsg) m.textContent = flashMsg;
    else m.textContent = sel != null ? t('msg.sel') : (s.ply === 0 ? t('msg.start') : '');
    // conto alla rovescia verso il record: scende a ogni mossa (anche del computer), sotto zero diventa negativo
    const left = REC - s.ply;
    $('cd-n').textContent = left < 0 ? '−' + (-left) : String(left);
    $('cd-l').textContent = t(left < 0 ? 'cd.over' : 'cd.label', { n: REC });
    $('cd').classList.toggle('over', left < 0); $('cd').classList.toggle('zero', left === 0);
    $('s-moves').textContent = s.ply; $('s-jumps').textContent = s.jumps; $('s-best').textContent = best == null ? '–' : best;
    $('undo').disabled = !!replay || !hist.length;
    $('undo').classList.toggle('primary', (lostWarn && mode === 'solo') || stuck); $('restart').disabled = !!replay; $('show').disabled = !!replay;
    $('m-solo').setAttribute('aria-pressed', mode === 'solo'); $('m-due').setAttribute('aria-pressed', mode === 'due');
    $('replay').hidden = !replay;
    if (replay) { $('r-note').innerHTML = t('rp.note', { k: replay.k, n: REC }); $('r-prev').disabled = replay.k === 0; $('r-next').disabled = replay.k >= T.SOLUTION.length; $('r-play').textContent = t(timer ? 'rp.pause' : 'rp.play'); }
  }
  const lastJump = () => last && T.legalMoves(hist[hist.length - 1]).some(x => x.from === last.from && x.to === last.to && x.jump);

  function startReplay() { saved = { game, hist, last }; replay = { k: 0 }; game = T.newGame(); hist = []; last = null; sel = null; initPieces(game.board); place(false); render(); }
  function replayTo(k) {
    stop(); game = T.newGame(); hist = [];
    for (let i = 0; i < k; i++) { hist.push(game); game = T.play(game, T.legalMoves(game).find(m => m.from === T.SOLUTION[i].from && m.to === T.SOLUTION[i].to)); }
    last = k ? T.SOLUTION[k - 1] : null; replay.k = k; initPieces(game.board); place(false); render();
  }
  function stepReplay() {
    if (replay.k >= T.SOLUTION.length) { stop(); render(); return; }
    const sm = T.SOLUTION[replay.k];
    replay.k++;
    doMove(T.legalMoves(game).find(m => m.from === sm.from && m.to === sm.to));
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function exitReplay() { stop(); replay = null; ({ game, hist, last } = saved); saved = null; initPieces(game.board); place(false); render(); }

  $('undo').onclick = undo;
  $('restart').onclick = reset;
  $('show').onclick = startReplay;
  $('r-next').onclick = () => { stop(); stepReplay(); };
  $('r-prev').onclick = () => replayTo(replay.k - 1);
  $('r-play').onclick = () => { if (timer) { stop(); render(); return; } if (replay.k >= T.SOLUTION.length) replayTo(0); timer = setInterval(stepReplay, 650); render(); };
  $('r-exit').onclick = exitReplay;
  const setMode = m => { mode = m; thinking = 0; try { localStorage.setItem('transporte-mode', m); } catch (e) {} render(); computerTurn(); };
  $('m-solo').onclick = () => setMode('solo');
  $('m-due').onclick = () => setMode('due');
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); } if (e.key === 'Escape') { sel = null; render(); } });

  function start(data) {
    reset();
    if (data && Array.isArray(data.moves)) {
      const keep = mode; mode = 'due';
      for (const mv of data.moves) { const m = T.legalMoves(game).find(x => x.from === mv[0] && x.to === mv[1]); if (!m) break; doMove(m); }
      mode = keep; last = null; planCache = null; render();
    }
    computerTurn();
  }
  // per le prove automatiche: lettura della posizione attuale
  window.TransporteUI = { state: () => game, thinking: () => !!thinking };
  function moveList() {
    const src = replay ? saved : { game, hist };
    const seq = []; const all = [...src.hist, src.game];
    for (let i = 1; i < all.length; i++) { const a = all[i - 1].board, b = all[i].board; const from = a.findIndex((v, j) => v && !b[j]); const to = b.findIndex((v, j) => v && !a[j]); seq.push([from, to]); }
    return seq;
  }
  // la partita resta salvata nel dispositivo (il menu della Collezione la mostra come «Partita in corso»)
  function save() {
    if (replay) return;
    try { localStorage.setItem('transporte.partita.v1', JSON.stringify({ moves: moveList(), won: T.isGoal(game) })); } catch (e) {}
  }
  function restore() { try { const d = JSON.parse(localStorage.getItem('transporte.partita.v1')); return d && Array.isArray(d.moves) ? d : null; } catch (e) { return null; } }
  window.claude?.hot?.snapshot?.(() => ({ moves: moveList() }));
  // Tasto Indietro di Android: torna al menu della collezione (o chiude l'app se non c'è un menu)
  try {
    const C = window.Capacitor, A = C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.App;
    if (A) A.addListener('backButton', () => { if (sel != null) { sel = null; render(); return; } if (window.history.length > 1) window.history.back(); else A.exitApp(); });
  } catch (e) {}
  I18N.mount();
  const rpTitle = () => { document.querySelector('[data-i18n="rp.title"]').textContent = t('rp.title', { n: REC }); };
  rpTitle(); I18N.onChange(rpTitle);
  I18N.onChange(render);
  const boot = data => start(data && Array.isArray(data.moves) ? data : restore());
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
