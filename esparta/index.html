<title>Esparta · Populus Ludi</title>
<style>
/* Layout: il tabellone di betulla a sinistra come oggetto fisico, turno e opzioni a destra */
:root {
  --bg: #ecebe6;
  --surface: #f7f6f2;
  --ink: #23211d;
  --muted: #6b665c;
  --line: #d3cfc4;
  --accent: #b4532a;
  --accent-ink: #ffffff;
  --blu: #2f6fb8;
  --rosso: #c23b32;
  --wood: #ead7b4;
  --wood-edge: #d6bc8f;
  --burn: #d9895a;
  --burn-deep: #c0683a;
  --hint: #1f7a52;
  --board-ink: #2a2118;
  --board-hint: #17704a;
  --f-display: "Marcellus SC", "Trajan Pro", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --board-shadow: rgba(70, 45, 20, .24);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a18; --surface: #252421; --ink: #ece8df; --muted: #a39d90; --line: #3b3934;
    --accent: #e07b4c; --accent-ink: #1b1a18; --hint: #5fd09a; --board-shadow: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a18; --surface: #252421; --ink: #ece8df; --muted: #a39d90; --line: #3b3934;
  --accent: #e07b4c; --accent-ink: #1b1a18; --hint: #5fd09a; --board-shadow: rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.5; padding-inline: 16px; padding-block: 20px 32px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 28px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
header.top { max-width: 1080px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 2.4rem; letter-spacing: .14em; margin: 0; line-height: 1; }
.sub { color: var(--muted); margin: 0; }
.langsel { margin-left: auto; align-self: center; font: inherit; font-size: .9rem; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.langsel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.boardbox { min-width: 0; display: flex; justify-content: center; }
svg#board { width: min(100%, 520px, calc((100dvh - 120px) * 0.62)); height: auto; display: block; touch-action: manipulation; user-select: none; }
.boardbox { position: sticky; top: 12px; }
svg#board { filter: drop-shadow(0 12px 20px var(--board-shadow)); }
.modes { display: grid; gap: 8px; }
.modes label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modes select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.modes select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell { cursor: default; }
.cell.act { cursor: pointer; }
.cell:focus { outline: none; }
.cell:focus-visible .hit { stroke: var(--accent); stroke-width: 3; }
.panel { min-width: 0; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.turn { display: flex; align-items: center; gap: 12px; }
.dot { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset -3px -4px 6px rgba(0,0,0,.35), inset 3px 3px 5px rgba(255,255,255,.35); }
.dot.B { background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.75) 0 10%, transparent 34%), radial-gradient(circle at 38% 34%, #6a8ee0, #25429a 55%, #0f1d4f); }
.dot.R { background: radial-gradient(circle at 34% 30%, rgba(255,255,255,.75) 0 10%, transparent 34%), radial-gradient(circle at 38% 34%, #e0735e, #9e2d22 55%, #4a110c); }
.turn-name { font-family: var(--f-display); font-size: 1.35rem; letter-spacing: .08em; }
.status { margin: 10px 0 0; min-height: 3em; }
.status b { font-weight: 700; }
.budget { display: inline-block; font-family: var(--f-mono); font-size: .9rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-weight: 500; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
label.toggle { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .95rem; cursor: pointer; }
.lbl { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lost { transition: opacity .3s; }
.lost.zero { opacity: .4; }
.lost.bump { animation: bump .5s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes bump { 40% { transform: scale(1.3); } }
@media (prefers-reduced-motion: reduce) { .lost.bump { animation: none; } }
@media (max-width: 760px) {
  body { padding-block: 8px 24px; }
  header.top { margin-bottom: 8px; }
  h1 { font-size: 1.6rem; }
  .sub { display: none; }
  .wrap { gap: 12px; }
  .panel { display: contents; }
  #turnCard { order: -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; padding: 10px 12px; box-shadow: 0 6px 14px -10px rgba(0,0,0,.4); }
  .boardbox { order: 0; }
  .panel > .card:not(#turnCard) { order: 1; }
  .turn-name { font-size: 1.1rem; }
  .dot { width: 22px; height: 22px; }
  .status { min-height: 0; margin: 6px 0 8px; font-size: .92rem; line-height: 1.35; }
  button { padding: 7px 12px; font-size: .95rem; }
  svg#board { width: min(100%, calc((100dvh - 230px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 0.62)); }
  .boardbox { position: static; }
}
details summary { cursor: pointer; font-family: var(--f-display); letter-spacing: .06em; font-size: 1.05rem; }
details ul { padding-left: 1.2em; margin: 10px 0 0; display: grid; gap: 6px; }
.win { border-color: var(--accent); }
</style>

</div>

// Lingue dell'interfaccia: IT (fonte), PT-BR, EN, ES. build.js lo incorpora inline (niente fetch: funziona da file:// e come artifact).
// Uso: I18N.t('chiave', {var}) · elementi con data-i18n / data-i18n-html / data-i18n-aria / data-i18n-title · <select id="selLang">.
const I18N = ((STORE, DICT) => {
  const LANGS = { it: ['it', 'Italiano'], pt: ['pt-BR', 'Português'], en: ['en', 'English'], es: ['es', 'Español'] };
  const missing = new Set();
  function detect() {
    try { const s = localStorage.getItem(STORE); if (DICT[s]) return s; } catch (e) {}
    const nav = typeof navigator !== 'undefined' ? navigator.language || (navigator.languages || [])[0] || '' : '';
    return { pt: 'pt', es: 'es', it: 'it' }[String(nav).toLowerCase().slice(0, 2)] || 'en';
  }
  let lang = detect();
  const subs = [];
  const fmt = (s, v = {}) => typeof s === 'function' ? s(v) : s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  function t(k, v) {
    const s = k in DICT[lang] ? DICT[lang][k] : DICT.it[k];
    if (s === undefined) { missing.add(k); return k; }
    return fmt(s, v);
  }
  function apply() {
    if (typeof document === 'undefined') return;
    const q = (sel, f) => document.querySelectorAll(sel).forEach(f);
    q('[data-i18n]', e => { e.textContent = t(e.dataset.i18n); });
    q('[data-i18n-html]', e => { e.innerHTML = t(e.dataset.i18nHtml); });
    q('[data-i18n-aria]', e => e.setAttribute('aria-label', t(e.dataset.i18nAria)));
    q('[data-i18n-title]', e => e.setAttribute('title', t(e.dataset.i18nTitle)));
    document.title = t('doc.title');
    document.documentElement.lang = LANGS[lang][0];
    const s = document.getElementById('selLang');
    if (s) s.value = lang;
  }
  function set(l) {
    if (!DICT[l] || l === lang) return;
    lang = l;
    try { localStorage.setItem(STORE, l); } catch (e) {}
    apply();
    subs.forEach(f => f());
  }
  function mount() {
    const s = document.getElementById('selLang');
    if (s) {
      s.replaceChildren(...Object.keys(LANGS).map(k => {
        const o = document.createElement('option');
        o.value = k; o.lang = LANGS[k][0]; o.textContent = LANGS[k][1];
        return o;
      }));
      s.addEventListener('change', () => set(s.value));
    }
    apply();
  }
  return { t, set, apply, mount, onChange: f => subs.push(f), get lang() { return lang; }, DICT, missing };
})('esparta.lingua', {

// ESPARTA — motore di regole (funzioni pure, senza DOM)
const Esparta = (() => {
  const ROWS = [2, 3, 4, 5, 6, 7, 8, 7, 8, 7, 6, 5, 4, 3, 2];
  const LAST = ROWS.length - 1;
  const BLU = 'B', ROSSO = 'R';

  // Coordinate a x raddoppiata: vicini = (±2,0), (±1,±1)
  const cells = [];
  ROWS.forEach((n, y) => {
    for (let i = 0; i < n; i++) cells.push({ x: -(n - 1) + 2 * i, y });
  });
  const key = (x, y) => x + ',' + y;
  const index = new Map(cells.map((c, i) => [key(c.x, c.y), i]));
  const at = (x, y) => index.has(key(x, y)) ? index.get(key(x, y)) : -1;

  const DIRS = [[2, 0], [-2, 0], [1, 1], [-1, 1], [1, -1], [-1, -1]];
  const forwardDirs = p => p === BLU ? [[1, 1], [-1, 1]] : [[1, -1], [-1, -1]];
  const isForward = (p, d) => forwardDirs(p).some(f => f[0] === d[0] && f[1] === d[1]);
  const other = p => p === BLU ? ROSSO : BLU;

  const neighbors = i => DIRS.map(([dx, dy]) => at(cells[i].x + dx, cells[i].y + dy)).filter(j => j >= 0);
  const goalRow = p => p === BLU ? LAST : 0;

  function initialBoard() {
    const b = cells.map(() => null);
    cells.forEach((c, i) => {
      if (c.y <= 2) b[i] = BLU;
      if (c.y >= LAST - 2) b[i] = ROSSO;
    });
    return b;
  }

  function budget(board, i) {
    const g = neighbors(i).filter(j => board[j]).length;
    return g === 0 ? 1 : g;
  }

  // Segmenti legali da i: linea retta, fino a budget passi, salti liberi.
  // Casella vuota: solo diagonali in avanti (fine turno). Avversaria: ogni direzione (cattura).
  function segments(board, i) {
    const p = board[i];
    if (!p) return [];
    const max = budget(board, i);
    const out = [];
    for (const d of DIRS) {
      let { x, y } = cells[i];
      for (let s = 1; s <= max; s++) {
        x += d[0]; y += d[1];
        const j = at(x, y);
        if (j < 0) break;
        if (board[j] === p) continue;
        if (board[j] === null) {
          if (isForward(p, d)) out.push({ from: i, to: j, steps: s, capture: false });
        } else {
          out.push({ from: i, to: j, steps: s, capture: true });
        }
      }
    }
    return out;
  }

  function newGame() {
    return { board: initialBoard(), turn: BLU, bonus: false, winner: null, captured: { B: 0, R: 0 } };
  }

  // Mosse legali: ogni biglia del giocatore di turno (anche nel turno bonus dopo una cattura)
  function legalMoves(st) {
    if (st.winner) return [];
    const out = [];
    st.board.forEach((p, i) => { if (p === st.turn) out.push(...segments(st.board, i)); });
    return out;
  }

  function checkWinner(board) {
    for (const p of [BLU, ROSSO]) {
      if (cells.some((c, i) => c.y === goalRow(p) && board[i] === p)) return p;
      if (!board.includes(other(p))) return p;
    }
    return null;
  }

  function endTurn(st) {
    const s = { ...st, bonus: false, turn: other(st.turn) };
    // Regola provvisoria: chi non ha mosse legali passa il turno
    if (!s.winner && legalMoves(s).length === 0) s.passed = s.turn, s.turn = other(s.turn);
    else s.passed = null;
    return s;
  }

  function apply(st, mv) {
    const legal = legalMoves(st).find(m => m.from === mv.from && m.to === mv.to);
    if (!legal) throw new Error('Mossa non legale');
    return applyLegal(st, legal);
  }

  // Come apply, ma senza ricontrollare la mossa (per il giocatore automatico, che usa solo mosse legali)
  function applyLegal(st, legal) {
    const board = st.board.slice();
    const captured = { ...st.captured };
    if (legal.capture) captured[st.turn]++;
    board[legal.to] = board[legal.from];
    board[legal.from] = null;
    let s = { ...st, board, captured, winner: checkWinner(board) };
    if (s.winner) return { ...s, bonus: false };
    if (legal.capture) {
      s.bonus = true;
      if (legalMoves(s).length === 0) s = endTurn(s);
      return s;
    }
    return endTurn(s);
  }

  const label = i => String.fromCharCode(65 + cells[i].y) + (1 + (cells[i].x + ROWS[cells[i].y] - 1) / 2);

  return { ROWS, LAST, BLU, ROSSO, cells, at, neighbors, budget, segments, legalMoves, newGame, apply, applyLegal, endTurn, checkWinner, label, goalRow, other };
})();

<script>
(() => {
  const E = Esparta, NS = 'http://www.w3.org/2000/svg';
  const U = 24, H = U * Math.sqrt(3), M = 34;
  const svg = document.getElementById('board');
  const W = 14 * U + 2 * M, HT = E.LAST * H + 2 * M;
  svg.setAttribute('viewBox', `${-7 * U - M} ${-M} ${W} ${HT}`);
  const P = i => [E.cells[i].x * U, E.cells[i].y * H];
  const T = I18N.t, NAME = p => T('name.' + p);

  const el = (tag, attrs = {}, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };

  // Tabellone fisso: sagoma, scanalature, incavi
  const defs = el('defs', {}, svg);
  for (const [id, c] of [['gB', 'var(--blu)'], ['gR', 'var(--rosso)']]) {
    const g = el('radialGradient', { id, cx: '35%', cy: '30%', r: '75%' }, defs);
    el('stop', { offset: '0%', 'stop-color': '#ffffff', 'stop-opacity': '.85' }, g);
    el('stop', { offset: '22%', 'stop-color': c }, g);
    el('stop', { offset: '100%', 'stop-color': c, 'stop-opacity': '1' }, g);
    const g2 = el('radialGradient', { id: id + 's', cx: '50%', cy: '50%', r: '50%' }, defs);
    el('stop', { offset: '60%', 'stop-color': '#000', 'stop-opacity': '.28' }, g2);
    el('stop', { offset: '100%', 'stop-color': '#000', 'stop-opacity': '0' }, g2);
  }
  // Biglie di pietra lucida: lapislazzuli con pagliuzze di pirite (Blu) e diaspro venato (Rosso).
  // Ogni pietra è un <symbol> di raggio 1 disegnato una volta sola e richiamato con <use>.
  const gloss = el('radialGradient', { id: 'gloss', cx: '50%', cy: '50%', r: '50%' }, defs);
  el('stop', { offset: '0%', 'stop-color': '#fff', 'stop-opacity': '.85' }, gloss);
  el('stop', { offset: '100%', 'stop-color': '#fff', 'stop-opacity': '0' }, gloss);
  const rim = el('radialGradient', { id: 'rim', cx: '50%', cy: '50%', r: '50%' }, defs);
  el('stop', { offset: '70%', 'stop-color': '#000', 'stop-opacity': '0' }, rim);
  el('stop', { offset: '100%', 'stop-color': '#000', 'stop-opacity': '.45' }, rim);
  const STONE = {
    B: { hi: '#6a8ee0', mid: '#25429a', lo: '#0f1d4f', veins: [['#9fb8f5', 2.4, 4, .55], ['#0a1438', 1.6, 9, .5]],
      flecks: [[-.42, .18], [.31, -.38], [.48, .27], [-.12, .55], [.05, -.08], [-.55, -.22], [.22, .62]] },
    R: { hi: '#e0735e', mid: '#9e2d22', lo: '#4a110c', veins: [['#e89a7c', 1.3, 7, .5], ['#3a0a07', 2.1, 13, .55]], flecks: [] },
  };
  for (const [p, s] of Object.entries(STONE)) {
    const base = el('radialGradient', { id: 'base' + p, cx: '38%', cy: '34%', r: '70%' }, defs);
    el('stop', { offset: '0%', 'stop-color': s.hi }, base);
    el('stop', { offset: '55%', 'stop-color': s.mid }, base);
    el('stop', { offset: '100%', 'stop-color': s.lo }, base);
    const sym = el('symbol', { id: 'st' + p, viewBox: '-1 -1 2 2' }, defs);
    el('circle', { r: 1, fill: `url(#base${p})` }, sym);
    s.veins.forEach(([color, freq, seed, alpha], k) => {
      // rumore frattale colorato e ritagliato sul disco: le venature della pietra
      const f = el('filter', { id: `vein${p}${k}`, x: '-1', y: '-1', width: '2', height: '2', filterUnits: 'userSpaceOnUse', 'color-interpolation-filters': 'sRGB' }, defs);
      el('feTurbulence', { type: 'fractalNoise', baseFrequency: freq, numOctaves: 3, seed, result: 'n' }, f);
      const [r, g, b] = [1, 3, 5].map(i => parseInt(color.slice(i, i + 2), 16) / 255);
      el('feColorMatrix', { in: 'n', type: 'matrix', values: `0 0 0 0 ${r}  0 0 0 0 ${g}  0 0 0 0 ${b}  ${3 * alpha} 0 0 0 ${-1.2 * alpha}`, result: 'c' }, f);
      el('feComposite', { in: 'c', in2: 'SourceGraphic', operator: 'in' }, f);
      el('circle', { r: 1, fill: '#fff', filter: `url(#vein${p}${k})` }, sym);
    });
    for (const [x, y] of s.flecks) el('circle', { cx: x, cy: y, r: .045, fill: '#e3c160', opacity: '.9' }, sym);
    el('circle', { r: 1, fill: 'url(#rim)' }, sym);
    el('ellipse', { cx: -.32, cy: -.4, rx: .42, ry: .26, fill: 'url(#gloss)', transform: 'rotate(-28 -.32 -.4)' }, sym);
    el('circle', { cx: .38, cy: .46, r: .12, fill: '#fff', opacity: '.12' }, sym);
  }
  const stone = (p, x, y, r, parent) => el('use', { href: '#st' + p, x: x - r, y: y - r, width: 2 * r, height: 2 * r }, parent);
  const hull = [[-1, 0], [1, 0], [7, 6], [7, 8], [1, 14], [-1, 14], [-7, 8], [-7, 6]].map(([x, y]) => `${x * U},${y * H}`).join(' ');
  el('polygon', { points: hull, fill: 'var(--wood-edge)', stroke: 'var(--wood-edge)', 'stroke-width': 2 * M - 4, 'stroke-linejoin': 'round', transform: 'translate(0,3)' }, svg);
  el('polygon', { points: hull, fill: 'var(--wood)', stroke: 'var(--wood)', 'stroke-width': 2 * M - 6, 'stroke-linejoin': 'round' }, svg);
  const grooves = el('g', { stroke: 'var(--burn)', 'stroke-width': 4, 'stroke-linecap': 'round', opacity: '.75' }, svg);
  E.cells.forEach((c, i) => E.neighbors(i).forEach(j => {
    if (j > i) { const [a, b] = P(i), [x, y] = P(j); el('line', { x1: a, y1: b, x2: x, y2: y }, grooves); }
  }));
  const holes = el('g', {}, svg);
  E.cells.forEach((c, i) => { const [x, y] = P(i); el('circle', { cx: x, cy: y, r: U * .5, fill: 'var(--burn)' }, holes); el('circle', { cx: x, cy: y + 1.5, r: U * .36, fill: 'var(--burn-deep)', opacity: '.55' }, holes); });
  const lastLayer = el('g', {}, svg);
  const hintLayer = el('g', {}, svg);
  const pieceLayer = el('g', {}, svg);
  const topLayer = el('g', {}, svg);
  // Biglie perse: negli angoli liberi accanto alla punta di partenza di ciascun colore
  const lost = {};
  for (const [p, x, y] of [['B', -5.3 * U, .55 * H], ['R', -5.3 * U, 13.45 * H]]) {
    const g = el('g', { class: 'lost', role: 'img' }, svg);
    el('circle', { cx: x + 2, cy: y + 4, r: U * 1.05, fill: `url(#g${p}s)` }, g);
    stone(p, x, y, U * .96, g);
    const t = el('text', { x, y: y + 9, 'text-anchor': 'middle', 'font-family': 'Nunito Sans, Alegreya Sans, sans-serif', 'font-size': 27, 'font-weight': 700, fill: '#fff', stroke: 'rgba(0,0,0,.25)', 'stroke-width': .8 }, g);
    g.addEventListener('animationend', () => g.classList.remove('bump'));
    lost[p] = { g, t, n: null };
  }
  const hitLayer = el('g', {}, svg);
  const hits = E.cells.map((c, i) => {
    const [x, y] = P(i);
    const g = el('g', { class: 'cell', 'data-i': i }, hitLayer);
    el('circle', { class: 'hit', cx: x, cy: y, r: U * .95, fill: 'transparent', stroke: 'none' }, g);
    g.addEventListener('click', () => onCell(i));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onCell(i); } });
    return g;
  });

  // Stato
  let st, hist, sel, log, last, cur;
  const $ = id => document.getElementById(id);
  const N = window.Native;
  // L'IA gira in un Web Worker: lo schermo resta reattivo mentre il computer pensa
  const ai = NativeWorker.create({ source: [$('engine').textContent], call: 'EspartaAI2.choose', local: (s, l) => EspartaAI2.choose(s, l), timeout: 8000 });

  function fresh() { st = E.newGame(); hist = []; sel = null; log = []; last = null; cur = null; }
  function snapshot() { return JSON.parse(JSON.stringify({ st, sel, log, last, cur })); }
  function restore(s) { ({ st, sel, log, last, cur } = s); }

  // Avversario: un'altra persona o il computer
  const CFG = 'esparta.avversario.v1';
  const cfg = { mode: 'due', human: 'B', level: 'medio' };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem(CFG)) || {}); } catch (e) {}
  N.setHaptics(cfg.haptics !== false);
  // gen: un risultato dell'IA arrivato dopo «Annulla» o «Nuova partita» appartiene a un'altra partita e si scarta
  let cpuTimer = null, thinking = false, cpuBusy = false, gen = 0;
  const cpuTurn = () => cfg.mode === 'cpu' && !st.winner && st.turn !== cfg.human;
  function cancelCpu() { clearTimeout(cpuTimer); cpuTimer = null; thinking = false; cpuBusy = false; gen++; ai.cancel(); }
  function scheduleCpu() {
    if (cpuTimer || cpuBusy || !cpuTurn()) return;
    cpuTimer = setTimeout(() => { thinking = true; render(); cpuTimer = setTimeout(cpuStep, 30); }, 450);
  }
  function cpuStep() {
    cpuTimer = null;
    if (!cpuTurn()) { thinking = false; return render(); }
    const g = ++gen;
    cpuBusy = true;
    ai.run([st, cfg.level], { onTimeout: () => null }).then(({ value: m }) => {
      if (g !== gen) return;
      cpuBusy = false; thinking = false;
      if (!cpuTurn()) return render();
      if (m && !m.end) return play(m);
      if (st.bonus) return endChain();
      const any = E.legalMoves(st)[0];
      return any ? play(any) : render();
    }, err => { if (g === gen) { cpuBusy = false; thinking = false; if (!err.cancelled) console.error(err); render(); } });
  }
  function setCfg(k, v) {
    cfg[k] = v;
    try { localStorage.setItem(CFG, JSON.stringify(cfg)); } catch (e) {}
    cancelCpu(); sel = null; render();
  }

  function onCell(i) {
    if (st.winner || cpuTurn()) return;
    const from = sel;
    if (from !== null) {
      const mv = E.legalMoves(st).find(m => m.from === from && m.to === i);
      if (mv) return play(mv);
    }
    if (st.board[i] === st.turn) { sel = sel === i ? null : i; if (sel !== null) N.haptic('select'); }
    else sel = null;
    render();
  }

  function play(mv) {
    hist.push(snapshot());
    const who = st.turn;
    if (!cur) { cur = { who, text: E.label(mv.from) }; log.push(cur); }
    else cur.text += ' · ' + E.label(mv.from);
    cur.text += (mv.capture ? '×' : '–') + E.label(mv.to);
    st = E.apply(st, mv);
    last = mv;
    N.haptic(st.winner ? (cfg.mode === 'cpu' && st.winner !== cfg.human ? 'heavy' : 'success') : mv.capture ? 'medium' : 'light');
    if (!st.bonus) { if (st.winner) cur.text += ' ✦'; cur = null; sel = null; }
    else sel = null;
    render();
  }

  function endChain() {
    if (!st.bonus) return;
    hist.push(snapshot());
    st = E.endTurn(st); cur = null; sel = null;
    render();
  }

  function render() {
    const legal = E.legalMoves(st);
    const active = sel;
    const dests = active !== null ? legal.filter(m => m.from === active) : [];
    const movable = new Set(legal.map(m => m.from));
    const show = $('showGroups').checked;

    [lastLayer, hintLayer, pieceLayer, topLayer].forEach(g => g.replaceChildren());

    if (last) {
      const [a, b] = P(last.from), [x, y] = P(last.to);
      el('line', { x1: a, y1: b, x2: x, y2: y, stroke: 'var(--board-ink)', 'stroke-width': 3, 'stroke-dasharray': '2 7', 'stroke-linecap': 'round', opacity: '.45' }, lastLayer);
    }
    if (active !== null) {
      E.neighbors(active).forEach(j => { const [x, y] = P(j); el('circle', { cx: x, cy: y, r: U * .62, fill: 'none', stroke: 'var(--board-ink)', 'stroke-width': 1.5, opacity: '.35' }, hintLayer); });
    }
    st.board.forEach((p, i) => {
      if (!p) return;
      const [x, y] = P(i);
      el('circle', { cx: x + 2, cy: y + 4, r: U * .8, fill: `url(#g${p}s)` }, pieceLayer);
      stone(p, x, y, U * .72, pieceLayer);
      // Anello inciso sulle rosse: si distinguono dalle blu anche senza colori
      if (p === 'R') el('circle', { cx: x, cy: y, r: U * .55, fill: 'none', stroke: '#fff', 'stroke-width': 1.4, opacity: '.3' }, pieceLayer);
      if (show) {
        const t = el('text', { x, y: y + 5, 'text-anchor': 'middle', 'font-family': 'Nunito Sans, Alegreya Sans, sans-serif', 'font-size': 16, 'font-weight': 500, fill: '#fff' }, pieceLayer);
        t.textContent = E.budget(st.board, i);
      }
    });
    if (active !== null) {
      const [x, y] = P(active);
      el('circle', { cx: x, cy: y, r: U * .86, fill: 'none', stroke: 'var(--board-ink)', 'stroke-width': 3 }, topLayer);
    }
    dests.forEach(m => {
      const [x, y] = P(m.to);
      if (m.capture) el('circle', { cx: x, cy: y, r: U * .86, fill: 'none', stroke: 'var(--board-hint)', 'stroke-width': 3.5, 'stroke-dasharray': '6 4' }, topLayer);
      else el('circle', { cx: x, cy: y, r: U * .26, fill: 'var(--board-hint)' }, topLayer);
    });

    const destSet = new Set(dests.map(m => m.to));
    hits.forEach((g, i) => {
      const act = !cpuTurn() && (destSet.has(i) || movable.has(i));
      g.classList.toggle('act', act);
      if (act) g.setAttribute('tabindex', '0'); else g.removeAttribute('tabindex');
      g.setAttribute('role', act ? 'button' : 'presentation');
      const p = st.board[i];
      g.setAttribute('aria-label', (p ? T('aria.marble', { cell: E.label(i), p: NAME(p) }) : T('aria.empty', { cell: E.label(i) })) + (destSet.has(i) ? T(p ? 'aria.capture' : 'aria.dest') : ''));
    });

    // Pannello
    const who = st.winner || st.turn;
    $('turnDot').className = 'dot ' + who;
    const tag = p => cfg.mode === 'cpu' ? T(p === cfg.human ? 'tag.you' : 'tag.cpu') : '';
    const turnText = st.winner ? T('win', { p: NAME(st.winner), tag: tag(st.winner) }) : T('turn', { p: NAME(st.turn), tag: tag(st.turn) });
    if ($('turnName').textContent !== turnText) $('turnName').textContent = turnText;
    $('turnCard').classList.toggle('win', !!st.winner);
    let msg;
    if (st.winner) {
      msg = T(E.checkWinner(st.board) && !st.board.includes(E.other(st.winner)) ? 'msg.allCaptured' : 'msg.reachedTip');
      if (cfg.mode === 'cpu') msg = T(st.winner === cfg.human ? 'msg.youWon' : 'msg.cpuWon') + msg;
    } else if (cpuTurn()) {
      msg = T(thinking ? 'cpu.thinking' : (st.bonus ? 'cpu.bonus' : 'cpu.turn'));
    } else if (st.bonus && sel === null) {
      msg = T('msg.bonus', { p: NAME(st.turn) });
    } else if (sel !== null) {
      msg = T('msg.sel', { cell: E.label(sel), steps: T('steps', { n: E.budget(st.board, sel) }) }) + T(dests.length ? 'msg.pickDest' : 'msg.noMove');
    } else {
      msg = T('msg.pick');
    }
    if (st.passed && !st.winner && !st.bonus) msg = T('msg.passed', { p: NAME(E.other(st.turn)) }) + msg;
    // Solo se cambia: la regione aria-live non deve ripetere lo stesso annuncio a ogni clic
    if ($('status').innerHTML !== msg) $('status').innerHTML = msg;
    $('btnEnd').hidden = !st.bonus || !!st.winner || cpuTurn();
    $('selMode').value = cfg.mode; $('selSide').value = cfg.human; $('selLevel').value = cfg.level;
    $('lblSide').hidden = $('lblLevel').hidden = cfg.mode !== 'cpu';
    $('btnUndo').disabled = hist.length === 0;
    for (const p of ['B', 'R']) {
      const c = lost[p], n = st.captured[E.other(p)];
      if (c.n !== null && n > c.n) { c.g.classList.remove('bump'); void c.g.getBBox(); c.g.classList.add('bump'); }
      c.n = n; c.t.textContent = n;
      c.g.classList.toggle('zero', n === 0);
      c.g.setAttribute('aria-label', T('cap.title', { p: NAME(p), n }));
    }

    scheduleCpu();
  }

  $('btnEnd').addEventListener('click', endChain);
  $('btnUndo').addEventListener('click', () => {
    if (!hist.length) return;
    cancelCpu();
    restore(hist.pop());
    while (cfg.mode === 'cpu' && hist.length && st.turn !== cfg.human) restore(hist.pop());
    if (cur) cur = log[log.length - 1];
    render();
  });
  $('btnNew').addEventListener('click', () => { $('confirmNew').hidden = false; });
  $('btnNewNo').addEventListener('click', () => { $('confirmNew').hidden = true; });
  $('btnNewYes').addEventListener('click', () => { $('confirmNew').hidden = true; cancelCpu(); fresh(); render(); });
  $('selMode').addEventListener('change', e => setCfg('mode', e.target.value));
  $('selSide').addEventListener('change', e => setCfg('human', e.target.value));
  $('selLevel').addEventListener('change', e => setCfg('level', e.target.value));
  $('showGroups').addEventListener('change', render);
  $('optHaptics').checked = cfg.haptics !== false;
  $('optHaptics').addEventListener('change', e => {
    cfg.haptics = e.target.checked; N.setHaptics(cfg.haptics);
    try { localStorage.setItem(CFG, JSON.stringify(cfg)); } catch (err) {}
    if (cfg.haptics) N.haptic('light');
  });

  // Indietro (Android): chiude la domanda «Nuova partita?», poi deseleziona; altrimenti torna al menu
  N.onBack(() => {
    if (!$('confirmNew').hidden) { $('confirmNew').hidden = true; return true; }
    if (sel !== null) { sel = null; render(); return true; }
  });
  // In pausa: copia della partita nell'archivio nativo e IA ferma; alla ripresa il computer riprende il turno
  N.onPause(() => { N.save('esparta:partita', snapshot()); if (cpuBusy || cpuTimer) cancelCpu(); });
  N.onResume(() => render());
  N.keepAwake(true);

  // Sul telefono la scheda del turno sta sopra il tabellone: se il messaggio cambia numero di righe il tabellone salta.
  // Si riserva l'altezza del messaggio più lungo nella lingua e nella larghezza attuali.
  function reserveStatus() {

    s.parentNode.appendChild(probe);
    const p = NAME('R'), sel = T('msg.sel', { cell: 'g12', steps: T('steps', { n: 6 }) });
    let h = 0;
    for (const m of [T('msg.pick'), sel + T('msg.pickDest'), sel + T('msg.noMove'), T('msg.bonus', { p }), T('msg.passed', { p }) + T('msg.pick'),
      T('cpu.thinking'), T('cpu.turn'), T('cpu.bonus'), T('msg.youWon') + T('msg.allCaptured'), T('msg.cpuWon') + T('msg.reachedTip')]) {
      probe.innerHTML = m; h = Math.max(h, probe.offsetHeight);
    }
    probe.remove();
    s.style.minHeight = h ? h + 'px' : '';
  }
  addEventListener('resize', reserveStatus);
  I18N.onChange(() => { reserveStatus(); render(); });

  const SAVE = 'esparta.partita.v1';
  function save() { try { localStorage.setItem(SAVE, JSON.stringify(snapshot())); } catch (e) {} }
  function load() { try { const d = JSON.parse(localStorage.getItem(SAVE)); return d && d.st && 'bonus' in d.st ? d : null; } catch (e) { return null; } }

  function start(data) {
    if (!(data && data.st)) data = load();
    if (data && data.st) { restore(data); hist = []; if (cur) cur = log[log.length - 1]; }
    else {
      fresh();
      // nessuna partita nel WebView: si prova la copia nell'archivio nativo
      N.load('esparta:partita').then(d => {
        if (d && d.st && 'bonus' in d.st && !hist.length && !log.length) { restore(d); hist = []; if (cur) cur = log[log.length - 1]; render(); }
      });
    }
    render();
  }
  I18N.mount();
  reserveStatus();
  document.fonts?.ready.then(reserveStatus);
  window.claude?.hot?.snapshot?.(() => snapshot());
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
