<title>Ire · Populus Ludi</title>
<style>
/* Layout: il tabellone di noce come oggetto al centro dell'attenzione, un taccuino essenziale accanto */
:root {
  --bg: #efece6;
  --surface: #f8f6f2;
  --ink: #2a241f;
  --muted: #6e655b;
  --line: #d8d1c6;
  --accent: #2f6b4f;
  --accent-ink: #ffffff;
  --good: #2f6b4f;
  --bad: #a3392b;
  --walnut: #5a3a22;
  --walnut-edge: #3f2716;
  --groove: #e8c99a;
  --glass: #1f4a2c;
  --board-hint: #f4e2c0;
  --f-display: "Cormorant Garamond", Garamond, Georgia, serif;
  --f-body: "Karla", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --board-shadow: rgba(70, 45, 20, .24);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #191714; --surface: #23201c; --ink: #eee8df; --muted: #a59b8e; --line: #3a352f;
    --accent: #6cc59a; --accent-ink: #191714; --good: #6cc59a; --bad: #f08a78; --board-shadow: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #191714; --surface: #23201c; --ink: #eee8df; --muted: #a59b8e; --line: #3a352f;
  --accent: #6cc59a; --accent-ink: #191714; --good: #6cc59a; --bad: #f08a78; --board-shadow: rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.5; padding-inline: 16px; padding-block: 20px 32px; }
header.top { max-width: 1040px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 2.8rem; margin: 0; line-height: 1; letter-spacing: .02em; }
.sub { color: var(--muted); margin: 0; }
.langsel { margin-left: auto; align-self: center; font: inherit; font-size: .9rem; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.langsel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 350px); gap: 28px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.boardbox { min-width: 0; display: flex; justify-content: center; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
svg#board { width: 100%; max-width: 620px; height: auto; display: block; touch-action: manipulation; user-select: none; filter: drop-shadow(0 14px 22px var(--board-shadow)); }
.cell.act { cursor: pointer; }
.cell:focus { outline: none; }
.cell:focus-visible .hit { stroke: var(--board-hint); stroke-width: 3; }
.panel { min-width: 0; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat .n { font-family: var(--f-display); font-size: 2.2rem; font-weight: 600; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.stat .k { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.status { margin: 12px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 500; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
.chip.ok { color: var(--good); } .chip.ko { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions > button { flex: 1 1 auto; padding-inline: 10px; }
.rechelp { margin: 0 0 12px; font-size: .92rem; line-height: 1.45; color: var(--muted); }
button { font: inherit; font-weight: 500; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.lbl { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
ol.log { margin: 0; padding-left: 2.4em; font-family: var(--f-mono); font-size: .85rem; max-height: 170px; overflow-y: auto; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-style: italic; margin: 0; }
details summary { cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 1.2rem; }
details ul { padding-left: 1.2em; margin: 10px 0 0; display: grid; gap: 6px; }
.prov { color: var(--accent); font-weight: 500; }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 12px; font-size: .92rem; color: var(--muted); }
.seg .opts { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 10px; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.card.end-win { border-color: var(--good); }
.card.end-lose { border-color: var(--bad); }
@media (max-width: 760px) {
  body { padding-block: 8px 24px; }
  header.top { margin-bottom: 8px; }
  h1 { font-size: 2rem; }
  .sub { display: none; }
  .wrap { gap: 12px; }
  .panel { display: contents; }
  #mainCard { order: -1; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; padding: 10px 12px; box-shadow: 0 6px 14px -10px rgba(0,0,0,.4); }
  .boardbox { order: 0; position: static; }
  .panel > .card:not(#mainCard) { order: 1; }
  .stat .n { font-size: 1.6rem; }
  .status { margin: 6px 0 8px; font-size: .92rem; line-height: 1.35; }
  button { padding: 7px 12px; font-size: .95rem; }
  svg#board { max-height: calc(100dvh - 230px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); width: auto; max-width: 100%; }
}
@keyframes fade { from { opacity: .9 } to { opacity: 0 } }
.ghost { animation: fade .9s ease-out forwards; }
@media (prefers-reduced-motion: reduce) { .ghost { animation: none; opacity: 0; } }
</style>

        </ul>
      </details>
    </section>
  </aside>
</div>

<script>
// Lingue dell'interfaccia: IT (fonte), PT-BR, EN, ES. build.js lo incorpora inline (niente fetch: funziona da file:// e come artifact).
// Uso: I18N.t('chiave', {var}) · elementi con data-i18n / data-i18n-html / data-i18n-aria / data-i18n-title · <select id="selLang">.
const I18N = ((STORE, DICT) => {
  const LANGS = { it: ['it', 'Italiano'], pt: ['pt-BR', 'Português'], en: ['en', 'English'], es: ['es', 'Español'] };
  const missing = new Set();
  function detect() {
    try { const s = localStorage.getItem(STORE); if (DICT[s]) return s; } catch (e) {}
    const nav = typeof navigator !== 'undefined' ? navigator.language || (navigator.languages || [])[0] || '' : '';
    return { pt: 'pt', es: 'es', it: 'it' }[String(nav).toLowerCase().slice(0, 2)] || 'en';
  }
  let lang = detect();
  const subs = [];
  const fmt = (s, v = {}) => typeof s === 'function' ? s(v) : s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  function t(k, v) {
    const s = k in DICT[lang] ? DICT[lang][k] : DICT.it[k];
    if (s === undefined) { missing.add(k); return k; }
    return fmt(s, v);
  }
  function apply() {
    if (typeof document === 'undefined') return;
    const q = (sel, f) => document.querySelectorAll(sel).forEach(f);
    q('[data-i18n]', e => { e.textContent = t(e.dataset.i18n); });
    q('[data-i18n-html]', e => { e.innerHTML = t(e.dataset.i18nHtml); });
    q('[data-i18n-aria]', e => e.setAttribute('aria-label', t(e.dataset.i18nAria)));
    q('[data-i18n-title]', e => e.setAttribute('title', t(e.dataset.i18nTitle)));
    document.title = t('doc.title');
    document.documentElement.lang = LANGS[lang][0];
    const s = document.getElementById('selLang');
    if (s) s.value = lang;
  }
  function set(l) {
    if (!DICT[l] || l === lang) return;
    lang = l;
    try { localStorage.setItem(STORE, l); } catch (e) {}
    apply();
    subs.forEach(f => f());
  }
  function mount() {
    const s = document.getElementById('selLang');
    if (s) {
      s.replaceChildren(...Object.keys(LANGS).map(k => {
        const o = document.createElement('option');
        o.value = k; o.lang = LANGS[k][0]; o.textContent = LANGS[k][1];
        return o;
      }));
      s.addEventListener('change', () => set(s.value));
    }
    apply();
  }
  return { t, set, apply, mount, onChange: f => subs.push(f), get lang() { return lang; }, DICT, missing };
})('ire.lingua', {

<script>
// IRE — motore di regole (funzioni pure, senza DOM)
const Ire = (() => {
  const ROWS = [4, 5, 6, 7, 6, 5, 4];
  const MID = 3;
  // Coordinate a x raddoppiata: vicini = (±2,0), (±1,±1)
  const cells = [];
  ROWS.forEach((n, y) => { for (let i = 0; i < n; i++) cells.push({ x: -(n - 1) + 2 * i, y }); });
  const index = new Map(cells.map((c, i) => [c.x + ',' + c.y, i]));
  const at = (x, y) => index.has(x + ',' + y) ? index.get(x + ',' + y) : -1;
  const DIRS = [[2, 0], [-2, 0], [1, 1], [-1, 1], [1, -1], [-1, -1]];
  // vicini precalcolati: il risolutore chiama step milioni di volte
  const NB = cells.map(c => DIRS.map(d => at(c.x + d[0], c.y + d[1])));
  const OPP = DIRS.map(([a, b]) => DIRS.findIndex(([c, e]) => c === -a && e === -b));
  const stepK = (i, k) => i < 0 ? -1 : NB[i][k];
  const step = (i, d) => stepK(i, DIRS.indexOf(d));
  const neighbors = i => DIRS.map(d => step(i, d)).filter(j => j >= 0);
  const CENTER = at(0, MID);
  const RING = new Set(neighbors(CENTER));
  const BORDER = cells.map((c, i) => i).filter(i => neighbors(i).length < 6);
  const CORNERS = cells.map((c, i) => i).filter(i => neighbors(i).length === 3);

  // board[i]: 'T' bersaglio, null vuota. Le due Ire stanno in st.ire (mobile) e st.second (ferma).
  // paika: mossa senza cattura quando non ce ne sono (spenta: l'autore non la usa)
  // fila: true = si prende tutta la fila di biglie attaccate; false = la cattura si ferma alla prima biglia
  function newGame(second = CORNERS[0], { paika = false, fila = false } = {}) {
    if (!CORNERS.includes(second)) throw new Error('La seconda Ire va su un angolo');
    const board = cells.map((c, i) => (i === CENTER || i === second || RING.has(i)) ? null : 'T');
    return { board, ire: CENTER, second, paika, fila, moves: 0, last: null, won: false };
  }

  const remaining = st => st.board.filter(p => p === 'T').length;

  // Fila catturata: deve cominciare nella casella subito accanto e prosegue sui bersagli contigui.
  // L'altra Ire si cattura solo per ultima, quando non restano bersagli.
  function captureLine(st, start, k) {
    if (start === st.second) return remaining(st) === 0 ? [start] : [];
    const out = [];
    let x = start;
    while (x >= 0 && st.board[x] === 'T') { out.push(x); if (!st.fila) break; x = stepK(x, k); }
    return out;
  }

  function captures(st, pos = st.ire) {
    const out = [];
    for (let k = 0; k < 6; k++) {
      const to = stepK(pos, k);
      if (to < 0 || to === st.second || st.board[to]) continue;
      const a = captureLine(st, stepK(to, k), k);
      const w = captureLine(st, stepK(pos, OPP[k]), OPP[k]);
      if (a.length) out.push({ from: pos, to, cap: a, kind: 'avvicinamento' });
      if (w.length) out.push({ from: pos, to, cap: w, kind: 'allontanamento' });
    }
    return out;
  }

  // Senza catture possibili si può spostare l'Ire di una casella senza catturare (paika del Fanorona)
  function quietMoves(st, pos = st.ire) {
    return NB[pos].filter(to => to >= 0 && to !== st.second && !st.board[to])
      .map(to => ({ from: pos, to, cap: [], kind: 'senza cattura' }));
  }

  function legalMoves(st) {
    if (st.won) return [];
    const c = captures(st);
    // Senza bersagli non c'è più niente da catturare: l'Ire cammina libera fino a catturare l'altra
    return c.length || !(st.paika || remaining(st) === 0) ? c : quietMoves(st);
  }

  function apply(st, mv) {
    const m = legalMoves(st).find(x => x.to === mv.to && (!mv.cap || !mv.cap.length || x.cap[0] === mv.cap[0]));
    if (!m) throw new Error('Mossa non legale');
    const board = st.board.slice();
    m.cap.forEach(i => { board[i] = null; });
    return { ...st, board, ire: m.to, moves: st.moves + 1, last: m, won: m.cap.includes(st.second) };
  }

  function status(st) {
    if (st.won) return 'vinto';
    return legalMoves(st).length ? 'in-corso' : 'bloccato';
  }

  // Risolutore. Le mosse senza cattura non tolgono bersagli, quindi per ogni insieme di bersagli
  // si esplora la zona raggiungibile senza catturare e si provano le catture da ciascuna casella.
  const memo = new Map();
  // chiave numerica (37 bit di bersagli + Ire + angolo + varianti < 2^53): molto più rapida della stringa
  const keyOf = st => { let k = 0; for (let i = 0; i < st.board.length; i++) k = k * 2 + (st.board[i] ? 1 : 0); return ((k * 64 + st.ire) * 64 + st.second) * 4 + (st.paika ? 2 : 0) + (st.fila ? 1 : 0); };
  function zone(st) {
    const seen = new Set([st.ire]), order = [st.ire], parent = new Map();
    for (let k = 0; k < order.length; k++) {
      const p = order[k];
      if (!(st.paika || remaining(st) === 0) || captures(st, p).length) continue;
      for (const m of quietMoves(st, p)) if (!seen.has(m.to)) { seen.add(m.to); parent.set(m.to, p); order.push(m.to); }
    }
    return { order, parent };
  }
  function after(st, m) {
    const board = st.board.slice();
    m.cap.forEach(i => { board[i] = null; });
    return { ...st, board, ire: m.to, won: m.cap.includes(st.second) };
  }
  function winningCapture(st) {
    const { order, parent } = zone(st);
    for (const p of order) {
      for (const m of captures(st, p)) {
        if (solvable(after(st, m))) return { p, m, parent };
      }
    }
    return null;
  }
  function solvable(st) {
    if (st.won) return true;
    const k = keyOf(st);
    if (memo.has(k)) return memo.get(k);
    memo.set(k, false);
    const r = !!winningCapture(st);
    memo.set(k, r);
    return r;
  }
  function hint(st) {
    if (st.won) return null;
    const w = winningCapture(st);
    if (!w) return null;
    if (w.p === st.ire) return w.m;
    let p = w.p;
    while (w.parent.get(p) !== st.ire) p = w.parent.get(p);
    return quietMoves(st).find(m => m.to === p);
  }

  const label = i => String.fromCharCode(65 + cells[i].y) + (1 + (cells[i].x + ROWS[cells[i].y] - 1) / 2);

  return { ROWS, MID, cells, at, neighbors, CENTER, RING, BORDER, CORNERS, newGame, captures, quietMoves, legalMoves, apply, remaining, status, solvable, hint, label };
})();
if (typeof module !== 'undefined') module.exports = Ire;

</script>
<script>
/* native.js — strato comune per i giochi (Esparta, Ire, Metamorphose).
   Script classico, nessuna dipendenza: si incolla inline nella pagina.
   In Capacitor (Android) usa i plugin Haptics, Preferences, Share, App tramite
   window.Capacitor.Plugins, che il bridge Android popola da sé, senza bundler.
   Altrove (browser, file://, artifact, Node) ripiega su API web, sempre in try/catch. */

  'use strict';

  // ---------- vibrazione ----------
  var WEB_PATTERN = { light: 10, medium: 20, heavy: 35, success: [12, 60, 12], error: [40, 50, 40, 50, 40], select: 6 };
  var hapticsOn = true;

        if (kind === 'error') return quiet(H.notification({ type: 'ERROR' }));
        if (kind === 'warning') return quiet(H.notification({ type: 'WARNING' }));
        if (kind === 'select') return quiet(H.selectionChanged ? H.selectionChanged({}) : H.impact({ style: 'LIGHT' }));
        var style = kind === 'heavy' ? 'HEAVY' : kind === 'medium' ? 'MEDIUM' : 'LIGHT';

  }

  }

    try { if (nav && nav.clipboard && nav.clipboard.writeText) { await nav.clipboard.writeText(text); return true; } } catch (e) {}
    try {
      var d = root.document; if (!d || !d.body) return false;
      var ta = d.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      d.body.appendChild(ta); ta.select();
      var ok = d.execCommand && d.execCommand('copy');
      d.body.removeChild(ta);

    } catch (e) { return false; }
  }
  // Ritorna 'shared' | 'copied' | 'cancelled' | 'failed'
  async function share(opts) {

    if (opts.title) data.title = opts.title;
    if (opts.text) data.text = opts.text;
    if (opts.url) data.url = opts.url;
    var S = plugin('Share');
    if (S) {
      try { await S.share(Object.assign({ dialogTitle: opts.title || undefined }, data)); return 'shared'; }
      catch (e) { if (/cancel/i.test(String(e && (e.message || e)))) return 'cancelled'; }
    }

    else if (s === 'separate') msg = T('msg.separate');

    else if (pending !== null) msg = T('msg.pending');
    else if (st.moves === 0) msg = T('msg.start');
    else if (legal.every(m => !m.cap.length)) msg = T(n === 0 ? 'msg.walk' : 'msg.quiet');
    else if (n === 0) msg = T('msg.lastCap');
    else msg = T('msg.play');
    if (!rec && s === 'in-corso' && $('showSolv').checked) {
      msg += E.solvable(st) ? ` <span class="chip ok">${T('chip.ok')}</span>` : ` <span class="chip ko">${T('chip.ko')}</span>`;
    }
    $('status').innerHTML = msg;
    $('btnUndo').disabled = hist.length === 0;
    $('btnHint').disabled = rec || s !== 'in-corso';
    $('btnRec').textContent = T(rec ? 'btn.recStop' : 'btn.rec');
    $('btnRecOk').hidden = !rec || st.won;
    $('btnCopy').hidden = !log.length;
    if (!copied) $('btnCopy').textContent = T(N.isNative ? 'btn.share' : 'btn.copy');
    card.classList.toggle('end-lose', !rec && (s === 'bloccato' || s === 'separate'));
    const ol = $('log'); ol.replaceChildren();
    log.forEach(e => { const li = document.createElement('li'); li.textContent = logText(e); ol.appendChild(li); });
    $('logEmpty').hidden = log.length > 0;
    ol.scrollTop = ol.scrollHeight;
    save();
  }

  $('btnHint').addEventListener('click', () => {
    const h = E.hint(st);
    if (!h) { N.haptic('warning'); $('status').innerHTML = `<span class="chip ko">${T('chip.ko')}</span> ${T('msg.noSolution')}`; return; }
    pending = null;
    hints++; hintMove = h; render();
  });
  $('btnUndo').addEventListener('click', () => { if (hist.length) { ({ st, log, hints } = hist.pop()); hintMove = null; pending = null; rDest = null; rCaps.clear(); render(); } });
  // Ricomincia subito; «Annulla» riporta la partita di prima
  $('btnNew').addEventListener('click', () => { const h = hist.concat([snap()]); fresh(); hist = h; rDest = null; rCaps.clear(); render(); });
  $('btnRec').addEventListener('click', () => setRec(!rec));
  $('btnRecOk').addEventListener('click', recConfirm);
  $('btnCopy').addEventListener('click', () => {
    const text = T('copy.head', { cell: E.label(st.second) }) + '\n' + log.map((e, k) => `${k + 1}. ${logText(e)}`).join('\n');
    const done = () => { copied = true; $('btnCopy').textContent = T('btn.copied'); setTimeout(() => { copied = false; render(); }, 1500); };
    const fail = () => { $('status').innerHTML = T('copy.fail'); };
    // Sul telefono si apre il pannello di condivisione (WhatsApp, email…); nel browser si copia
    if (N.isNative) N.share({ title: 'Ire', text }).then(r => { if (r === 'copied') done(); else if (r === 'failed') fail(); });
    else N.copyText(text).then(ok => ok ? done() : fail());
  });
  $('optHaptics').checked = N && (() => { try { return localStorage.getItem(HAPT) !== '0'; } catch (e) { return true; } })();
  $('optHaptics').addEventListener('change', e => {
    N.setHaptics(e.target.checked);
    try { localStorage.setItem(HAPT, e.target.checked ? '1' : '0'); } catch (err) {}
    if (e.target.checked) N.haptic('light');
  });
  // Indietro (Android): annulla la scelta della biglia, poi esce dalla registrazione; altrimenti torna al menu
  N.onBack(() => {
    if (pending !== null) { pending = null; render(); return true; }
    if (rec) { setRec(false); return true; }
  });
  N.onPause(() => N.save('ire:partita', snap()));
  N.keepAwake(true);
  // Sul telefono la scheda sta sopra il tabellone: se il messaggio cambia numero di righe il tabellone salta.
  // Si riserva l'altezza del messaggio più lungo nella lingua e nella larghezza attuali.
  function reserveStatus() {
    const el = $('status'), probe = el.cloneNode(false);
    probe.removeAttribute('id');
    probe.style.cssText = `position:absolute;visibility:hidden;left:0;top:0;width:${el.clientWidth}px;min-height:0`;
    el.parentNode.appendChild(probe);
    const chip = ` <span class="chip ko">${T('chip.ko')}</span>`;
    let h = 0;
    for (const k of ['msg.start', 'msg.play', 'msg.pending', 'msg.walk', 'msg.quiet', 'msg.lastCap', 'msg.won', 'msg.separate', 'msg.blocked']) {
      probe.innerHTML = T(k, { n: 29 }) + chip;
      h = Math.max(h, probe.offsetHeight);
    }
    probe.remove();
    el.style.minHeight = h ? h + 'px' : '';
  }
  addEventListener('resize', reserveStatus);
  $('showSolv').addEventListener('change', () => render());
  I18N.onChange(() => { reserveStatus(); render(); });

  function start(data) {
    if (!(data && data.st)) data = load();
    if (data && data.st) { ({ st, log, hints } = data); hist = []; hintMove = null; }
    else {
      fresh();
      N.load('ire:partita').then(d => {
        if (d && d.st && d.st.board && 'fila' in d.st && !hist.length && !log.length) { ({ st, log, hints } = d); hintMove = null; render(); }
      });
    }
    render();
  }
  I18N.mount();
  reserveStatus();
  document.fonts?.ready.then(reserveStatus);
  window.claude?.hot?.snapshot?.(() => snap());
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
